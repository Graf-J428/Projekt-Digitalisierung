<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Personal-Portal</title>
	<!-- UI5 wird von der UI5 CLI lokal unter /resources bereitgestellt (siehe ui5.yaml) -->
	<script
		id="sap-ui-bootstrap"
		src="resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resource-roots='{ "de.hsrm.personalportal": "./" }'
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true">
	</script>
</head>
<body class="sapUiBody" id="content">
	<div
		data-sap-ui-component
		data-name="de.hsrm.personalportal"
		data-id="container"
		data-settings='{ "id": "personalportal" }'
		data-height="100%">
	</div>
</body>
</html>
